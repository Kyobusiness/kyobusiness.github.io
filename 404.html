<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>NEW LIFE PORTAL</title>
<style>
*{box-sizing:border-box}
html{font:16px system-ui,sans-serif;color:#171917;background:#f7f7f3}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center}
main{width:min(calc(100% - 48px),360px)}
label{display:block;margin-bottom:16px;font-size:clamp(1.3rem,4vw,1.55rem);font-weight:550;letter-spacing:-.035em}
.entry{display:flex;border:1px solid #73766f;border-radius:4px;background:#fff}
.entry:focus-within{outline:2px solid #39443f;outline-offset:2px}
.entry.invalid{border:2px solid #942d22}
input{min-width:0;flex:1;padding:12px 14px;border:0;background:transparent;font:inherit;outline:0}
button{width:52px;min-height:48px;display:grid;place-items:center;border:0;background:transparent;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #39443f;outline-offset:-4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style></head><body><main><form method="post" action="/testsiteportal/">
<label for="pw" lang="en">Please enter password</label>
<div class="entry"><input disabled id="pw" name="password" type="password" required autocomplete="current-password" maxlength="256">
<button disabled type="submit" aria-label="Submit password"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button></div>
</form></main><script src="/testsiteportal/gate.js" defer></script></body></html>
